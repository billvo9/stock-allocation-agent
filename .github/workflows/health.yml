name: Model health

# Daily health checks on repository code and synthetic fixtures only:
# the quality gates (scripts/verify.py), the dependency check, the
# artifact-contract probes and the monitor smoke tests. The summary is a
# workflow artifact. CI cannot see the owner's Mac: private data and local
# models are monitored by `scripts/health_check.py local` on that machine.
# Alerts are informational; this workflow changes nothing anywhere.
# Third-party actions are pinned to full commit SHAs (version in the comment).
# The artifact is public to anyone with read access: the CI run refuses to
# write a summary holding an absolute path, the home directory or an email.
# Runbook: docs/operations/runbook.md.

on:
  schedule:
    # 06:17 UTC daily (off the hour, when scheduled runs queue less).
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Same layout as ci.yml and local development.
      - name: Create project virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install -e .

      # Exits 1 when the overall state is failed, so the run turns red and
      # GitHub notifies the owner. Nothing acts on the result.
      - name: Health checks (synthetic fixtures only)
        run: .venv/bin/python scripts/health_check.py ci --run-verify --output-dir "$RUNNER_TEMP/model-health"

      - name: Upload health summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model-health
          path: ${{ runner.temp }}/model-health/
          if-no-files-found: error
          retention-days: 30
