# Equity cross-sectional track, synthetic panel with a planted LINEAR signal.
# Purpose: the pipeline must recover a known signal (engineering check only).
# Expected: ridge and OLS show a positive coverage-weighted rank IC with a
# fold-block t well above 2. Synthetic data is never evidence about markets.
schema_version: "1.0"
experiment: equity_xs_planted_linear
track: equity_cross_sectional
description: >-
  Planted linear quality signal (s = 4e-4 per day, rank IC about 0.1 at h = 20);
  T4 nested-selected linear candidates against the T2 nulls, controls and canary.
data:
  source: synthetic_equity_panel
  params:
    n_assets: 30
    n_sessions: 1500
    start: "2012-01-03"
    signal: linear
    signal_strength: 0.0004
    late_listings: 3
    delistings: 1
    seed: 20261014
universe:
  id: synthetic_equity_30
  min_history_sessions: 60
features:
  families: [relative_technical, risk_liquidity, fundamental_quality]
label:
  horizon: 20
  entry_lag: 1
  benchmark: equal_weight
folds:
  start: "2014-07-01"
  block_sessions: 63
  inner_block_sessions: 63
  inner_windows: 4
  inner_min_train_sessions: 252
models:
  candidates: [ridge, lasso, elastic_net]
  include_ols: true
  increment_reference: ridge
evaluation:
  seed: 0
  permutation_draws: 19
  permutation_models: [per_symbol_mean, ridge]
  bootstrap_reps: 199
  calibration_reps: 2000
  calibration_bootstrap_reps: 199
registry:
  model_prefix: equity_xs
