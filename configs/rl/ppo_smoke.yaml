# PPO smoke run on synthetic scenarios: a few CPU minutes, engineering only.
# Every result is labelled with the injected transition's approval status.
schema_version: 1
name: ppo_smoke
split_plan: default # rl.splits.default_split_plan (time and seed separated)

features:
  return_windows: [5, 20, 60]
  vol_windows: [20, 60]
  include_cost_regime: true
  min_fraction: 0.5

env:
  rebalance_every: 5 # one decision per five complete sessions, for every policy
  rebalance_offset: 0

training:
  seeds: [0, 1, 2] # reported as a distribution, never the best seed alone
  total_timesteps: 24576 # per seed: 12 rollouts of n_steps x n_envs
  n_envs: 4
  episode_sessions: 252 # random training windows inside the train fold
  eval_every: 8192 # dev-fold checkpoint evaluation interval (timesteps)

ppo:
  learning_rate: 0.0003
  n_steps: 512
  batch_size: 128
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [64, 64]
  log_std_init: -0.5
  target_kl: null

cem: # the linear-softmax baseline, trained on the same train fold
  iterations: 4
  population: 12
  elite_fraction: 0.25
  init_std: 1.0
  min_std: 0.05
  seed: 0

gate:
  max_obs_age: 2
  z_limit: 8.0

health:
  max_param_abs: 10000.0
  kl_warning: 0.1
  clip_fraction_warning: 0.5
  min_action_std: 0.01
